<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Démo Piano Génératif</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; text-align: center; }
  #controls { margin: 20px; }
  select, button, input { padding: 6px; margin: 4px; }
  #waterfall { background: #000; display: block; margin: 20px auto; border: 1px solid #444; }
</style>
</head>
<body>
  <h2>Démo — Piano génératif (backend Python + FastAPI)</h2>

  <div id="controls">
    <select id="genre">
      <option value="classique">Classique</option>
      <option value="pop">Pop</option>
      <option value="jazz">Jazz</option>
    </select>
    <select id="emotion">
      <option value="triste">Triste</option>
      <option value="joyeux">Joyeux</option>
      <option value="calme">Calme</option>
      <option value="energique">Énergique</option>
    </select>
    <select id="mode">
      <option value="minor">Mineur</option>
      <option value="major">Majeur</option>
    </select>
    <select id="key">
      <option value="C">C</option>
      <option value="C#">C#/Db</option>
      <option value="D">D</option>
      <option value="Eb">D#/Eb</option>
      <option value="E">E</option>
      <option value="F">F</option>
      <option value="F#">F#/Gb</option>
      <option value="G">G</option>
      <option value="Ab">G#/Ab</option>
      <option value="A">A</option>
      <option value="Bb">A#/Bb</option>
      <option value="B">B</option>
    </select>
    <input id="measures" type="number" value="4" min="1" max="16" style="width: 50px;">
    <button onclick="generateAndPlay()">Générer et jouer</button>
  </div>

  <canvas id="waterfall" width="900" height="400"></canvas>

<script>
const API_URL = "http://localhost:8000/generate";
const canvas = document.getElementById("waterfall");
const ctx = canvas.getContext("2d");
const synth = new Tone.PolySynth(Tone.Synth).toDestination();

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

async function generateAndPlay() {
  const body = {
    genre: document.getElementById("genre").value,
    emotion: document.getElementById("emotion").value,
    mode: document.getElementById("mode").value,
    key: document.getElementById("key").value,
    measures: parseInt(document.getElementById("measures").value),
  };

  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();

  console.log("Reçu du backend:", data.metadata);
  console.log("Reçu du backend:", data);

  await Tone.start();
  Tone.Transport.stop();
  Tone.Transport.cancel();

  // --- Son : on programme chaque note sur la timeline audio ---
  data.notes.forEach(note => {
    Tone.Transport.schedule(time => {
      synth.triggerAttackRelease(
        midiToFreq(note.pitch),
        note.duration,
        time,
        note.velocity / 127
      );
    }, note.start_time);
  });

  // --- Animation waterfall : dessine les notes qui "tombent" ---
  drawWaterfall(data.notes, data.metadata.total_duration_seconds);

  Tone.Transport.start();
}

function drawWaterfall(notes, totalDuration) {
  const minPitch = 48, maxPitch = 84; // tessiture affichée
  const pxPerSecond = canvas.height / totalDuration;
  let startTime = performance.now();

  function frame() {
    const elapsed = (performance.now() - startTime) / 1000;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    notes.forEach(note => {
      const x = ((note.pitch - minPitch) / (maxPitch - minPitch)) * canvas.width;
      const yStart = canvas.height - (note.start_time - elapsed) * pxPerSecond;
      const h = note.duration * pxPerSecond;
      ctx.fillStyle = note.hand === "right" ? "#4fc3f7" : "#ffb74d";
      ctx.fillRect(x, yStart - h, 18, h);
    });

    if (elapsed < totalDuration) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
